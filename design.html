<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Are You A Roamer? – AfroCue</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Aesthet Nova';
      src: url('fonnts.com-Aesthet-Nova-Black.otf') format('opentype');
      font-weight: 900;
    }
    @font-face {
      font-family: 'Aesthet Nova';
      src: url('fonnts.com-Aesthet-Nova-Medium.otf') format('opentype');
      font-weight: 500;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Figtree', sans-serif;
    }

    .creative {
      position: relative;
      height: 100vh;
      width: auto;
      aspect-ratio: 9 / 16;
      background-color: #0a0a0a;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Background layers */
    .bg-image {
      position: absolute;
      inset: 0;
      background-image: url('roamers_ad_bg.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }
    .overlay-dark {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 1;
    }
    .overlay-texture {
      position: absolute;
      inset: 0;
      background-image: url('texture.jpg');
      background-size: cover;
      opacity: 0.15;
      mix-blend-mode: soft-light;
      z-index: 2;
    }
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.92) 0%,
        rgba(0,0,0,0.75) 20%,
        rgba(0,0,0,0.35) 45%,
        rgba(0,0,0,0.1) 70%,
        transparent 100%
      );
    }

    /* Content area – placed at the bottom */
    .content {
      position: absolute;
      bottom: 8%;
      left: 8%;
      right: 8%;
      z-index: 4;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .headline-small {
      font-family: 'Aesthet Nova', sans-serif;
      font-weight: 500;
      font-size: 6vh;
      line-height: 1;
      color: #f0ede8;
      text-shadow: 2px 3px 0 rgba(0,0,0,0.9);
      margin-bottom: 1vh;
    }
    .headline-big {
      font-family: 'Aesthet Nova', sans-serif;
      font-weight: 900;
      font-size: 16vh;
      line-height: 0.85;
      color: #C8E000;
      text-shadow: 4px 5px 0 rgba(0,0,0,0.9), 0 0 30px rgba(200,224,0,0.15);
      margin-bottom: 3vh;
      letter-spacing: -0.02em;
    }
    .supporting-text {
      font-weight: 400;
      font-size: 3.2vh;
      color: rgba(240,237,232,0.8);
      margin-bottom: 4vh;
      letter-spacing: 0.02em;
    }

    /* Party chips */
    .chips-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5vh;
      margin-bottom: 5vh;
    }
    .chip {
      font-weight: 500;
      font-size: 2.6vh;
      color: #f0ede8;
      border: 1.5px solid rgba(240,237,232,0.35);
      border-radius: 999px;
      padding: 1.4vh 3.6vh;
      white-space: nowrap;
      background: transparent;
      backdrop-filter: blur(2px);
    }

    .closing-copy {
      font-weight: 400;
      font-size: 3.4vh;
      color: rgba(240,237,232,0.7);
      margin-bottom: 3.5vh;
    }

    /* CTA button */
    .cta-button {
      display: inline-block;
      background: #C8E000;
      color: #0a0a0a;
      font-weight: 700;
      font-size: 3.6vh;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2.5vh 6vh;
      border-radius: 2vh;
      text-decoration: none;
      box-shadow: 0 1.2vh 3vh rgba(0,0,0,0.5);
      margin-bottom: 2.5vh;
    }

    .url-line {
      font-weight: 400;
      font-size: 2.4vh;
      color: rgba(240,237,232,0.45);
      letter-spacing: 0.04em;
    }

    /* Make sure the canvas is centred on wide screens */
    @media (max-aspect-ratio: 9/16) {
      .creative {
        height: auto;
        width: 100vw;
        aspect-ratio: 9 / 16;
      }
    }
  </style>
</head>
<body>
  <div class="creative">
    <div class="bg-image"></div>
    <div class="overlay-dark"></div>
    <div class="overlay-texture"></div>
    <div class="vignette"></div>

    <div class="content">
      <div class="headline-small">ARE YOU A</div>
      <div class="headline-big">ROAMER?</div>
      <div class="supporting-text">Where have you been lately?</div>

      <div class="chips-grid">
        <span class="chip">Monochroma</span>
        <span class="chip">South Social</span>
        <span class="chip">Element House</span>
        <span class="chip">Amapiano District</span>
        <span class="chip">Group Therapy</span>
        <span class="chip">PM2AM</span>
        <span class="chip">Even in the Day</span>
        <span class="chip">Sunday Service</span>
        <span class="chip">V6</span>
        <span class="chip">Tempo Lagos</span>
      </div>

      <div class="closing-copy">You might already be one.</div>

      <a href="https://afrocue.xyz/roamers" class="cta-button">TAKE THE 30-SECOND QUIZ</a>
      <div class="url-line">afrocue.xyz/roamers</div>
    </div>
  </div>
</body>
</html>
