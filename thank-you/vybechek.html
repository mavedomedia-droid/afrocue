<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request received | VybeChek by AfroCue</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap">
<style>
@font-face{font-family:'Aesthet Nova';font-weight:900;font-display:swap;src:url('/fonnts.com-Aesthet-Nova-Black.woff2') format('woff2')}
:root{--ink:#0d0d0c;--line:#2c2c27;--cream:#f1ece1;--mute:#a8a69c;--y:#dedc00}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--ink) url('/assets/texture.jpg') center top/100% auto repeat-y;color:var(--cream);font-family:Figtree,system-ui,sans-serif;line-height:1.45;display:flex;flex-direction:column}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 20px}
nav{padding:18px 0}
nav img{width:46px;display:block}
main{flex:1;display:flex;align-items:center}
.kick{font-size:12px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--mute)}
h1{font-family:'Aesthet Nova',Figtree,sans-serif;font-weight:900;font-size:clamp(40px,11vw,64px);line-height:.95;letter-spacing:-.5px;margin:12px 0 0}
h1 em{font-style:normal;color:var(--y)}
p{font-size:17px;color:#d6d1c5;margin:16px 0 0}
.ticket{margin-top:28px;background:var(--cream);color:var(--ink);border-radius:16px;padding:18px 20px;position:relative}
.ticket::before,.ticket::after{content:'';position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--ink);margin-top:-11px}
.ticket::before{left:-11px}.ticket::after{right:-11px}
.ticket .row{display:flex;justify-content:space-between;gap:14px;font-size:14px;font-weight:700;padding:4px 0}
.ticket .row span:first-child{color:#6b685e}
.btn{display:inline-block;margin-top:26px;background:var(--y);color:var(--ink);border-radius:100px;padding:15px 24px;font-weight:800;font-size:16px;text-decoration:none}
footer{padding:30px 0 40px;font-size:11px;font-weight:800;letter-spacing:4px;color:var(--mute);text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap"><nav><img src="/logo_afrocue.png" alt="AfroCue"></nav></div>
<main><div class="wrap">
  <div class="kick">Request received</div>
  <h1>Thank you<span id="who"></span>. <em>We've got it.</em></h1>
  <p>We'll reach out within 48 hours on WhatsApp or email to bring VybeChek to your party.</p>
  <div class="ticket">
    <div class="row"><span>Party</span><span id="party">Your party</span></div>
    <div class="row"><span>Request</span><span>VybeChek</span></div>
    <div class="row"><span>Next step</span><span>We reach out</span></div>
  </div>
  <a class="btn" href="/vybechek/">Back to VybeChek</a>
</div></main>
<div class="wrap"><footer>afrocue.xyz</footer></div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var n = (q.get('name') || '').trim(), p = (q.get('party') || '').trim();
  if (n) document.getElementById('who').textContent = ', ' + n;
  if (p) document.getElementById('party').textContent = p;
  (window.dataLayer = window.dataLayer || []).push({event:'vybechek_party_thanks'});
})();
</script>
</body>
</html>
