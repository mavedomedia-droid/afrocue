            }

                transform: scale(0.94);

            to {

                transform: scale(1);
            }

            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 1px solid rgba(255, 255, 255, 0.06);
            pointer-events: none;
            z-index: 2;

            filter: blur(50px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;

            top: calc(50% - 2px);
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);

            border-radius: inherit;
            background: radial-gradient(circle at center, var(--accent-glow) 0%, transparent 70%);

            color: var(--text);
            transform: translateY(-1px);

        .time-mini {

            font-weight: 700;

            transition: transform 0.2s ease, box-shadow 0.3s ease, background 0.2s;

            color: var(--text);
            font-weight: 500;

            letter-spacing: 0.03em;

        .apple-btn:hover {
            background: var(--surface-hover);
            border-color: var(--border-light);
            transform: translateY(-1px);
        }

        .apple-btn:active {
            transform: scale(0.96);
        }

        .footer-note {

            }
            .spotify-btn {
                padding: 15px 20px;
                font-size: 0.9rem;
            }
        }
    </style>

                        pushEvent('preview_play', { track: trackName });
                    }).catch(err => {
                        console.warn('Autoplay prevented:', err);
                        setIsPlaying(false);
                    });
                }

                if (!hasActivated) {
                    hasActivated = true;
                    spotifyBtn.style.transition = 'transform 0.4s ease, box-shadow 0.4s ease';
                    spotifyBtn.style.transform = 'scale(1.02)';
                    spotifyBtn.style.boxShadow = '0 8px 36px rgba(29,185,84,0.6)';
                    setTimeout(() => {
                        spotifyBtn.style.transform = 'scale(1)';
                    }, 400);
                }
            }

            function setIsPlaying(state) {
                isPlaying = state;
                const activeBtn = document.querySelector('.track-option.active');
                if (activeBtn) {
                    if (state) {
                        activeBtn.classList.add('playing');
                    } else {
                        activeBtn.classList.remove('playing');
                    }
                }
            }

            function togglePlayPause() {
                if (isPlaying) {
                    audio.pause();
                    setIsPlaying(false);
                    pushEvent('preview_pause', { track: currentTrack.name });
                } else {
                    audio.play().then(() => {
                        setIsPlaying(true);
                        pushEvent('preview_play', { track: currentTrack.name });
                    }).catch(() => {});
                }
            }

            trackOptions.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const trackId = btn.dataset.track;
                    const trackName = btn.dataset.name;
                    const src = btn.dataset.src;

                    if (currentTrack.id === trackId) {
                        togglePlayPause();
                    } else {
                        loadAndPlay(trackId, trackName, src);
                        pushEvent('track_switch', { track: trackName });
                    }
                });
            });

            audio.addEventListener('timeupdate', updateProgress);
            audio.addEventListener('loadedmetadata', updateProgress);
            audio.addEventListener('ended', () => {
                setIsPlaying(false);
                progressFill.style.width = '100%';
                timeDisplay.textContent = formatTime(audio.duration || 0);
                pushEvent('preview_complete', { track: currentTrack.name });
                setTimeout(() => {
                    audio.currentTime = 0;
                    progressFill.style.width = '0%';
                    timeDisplay.textContent = '0:00';
                }, 800);
            });

            spotifyBtn.addEventListener('click', () => {
                pushEvent('stream_click', { platform: 'Spotify' });
            });
            appleBtn.addEventListener('click', () => {
                pushEvent('stream_click', { platform: 'Apple Music' });
            });

            // Prepare first track without autoplay
            audio.src = currentTrack.src;
            audio.load();
            nowPlayingTitle.textContent = currentTrack.name;
        })();
    </script>
</body>
</html>
