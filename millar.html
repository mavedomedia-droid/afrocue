    <style>
        :root {
            --deep-black: #080808;
            --black: #101010;
            --near-black: #1a1a1a;
            --charcoal: #292929;
            --dark-grey: #414141;
            --mid-grey: #777777;
            --silver-grey: #aaaaaa;
            --light-grey: #d0d0d0;
            --off-white: #eeeeee;
            --white: #ffffff;

            --radius-sm: 4px;
            --radius: 8px;
            --radius-lg: 14px;
            --radius-full: 9999px;

            --font-display: 'Inter', 'Helvetica Neue', Arial, sans-serif;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;

            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);

            --shadow-artwork: 0 30px 80px rgba(0,0,0,0.85), 0 10px 30px rgba(0,0,0,0.6);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--deep-black);
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-display);
            background: var(--deep-black);
            color: var(--off-white);
            min-height: 100vh;
            min-height: 100dvh;
            line-height: 1.4;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .bg-blur {
            position: fixed;
            inset: -10%;
            z-index: 0;
            background-image: var(--artwork-url, url('gbadura_ya_allahu_cover.jpg'));
            background-size: cover;
            background-position: center;
            filter: blur(80px) grayscale(100%) brightness(0.35) contrast(1.1);
            opacity: 0.4;
            pointer-events: none;
            transform: scale(1.15);
        }

        .bg-vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(ellipse at 50% 40%, transparent 0%, rgba(8,8,8,0.7) 65%, var(--deep-black) 100%),
                linear-gradient(to bottom, rgba(8,8,8,0.4) 0%, transparent 25%, transparent 70%, var(--deep-black) 100%);
            pointer-events: none;
        }

        .prayer-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -52%);
            width: 115%;
            max-width: 620px;
            color: var(--white);
            opacity: 0.055;
            z-index: 2;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .prayer-bg svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .bg-grain {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0.055;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 220px 220px;
            mix-blend-mode: overlay;
        }

        .page {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 22px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ═══════════════ HERO ═══════════════ */

        .hero {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: heroEnter 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @keyframes heroEnter {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .artwork-wrap {
            position: relative;
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1 / 1;
            margin-bottom: 22px;
            animation: artworkReveal 1.1s 0.15s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @keyframes artworkReveal {
            from { opacity: 0; transform: scale(0.94); }
            to   { opacity: 1; transform: scale(1); }
        }

        .artwork-wrap::before {
            content: '';
            position: absolute;
            inset: -8%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.08) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            filter: blur(20px);
        }

        .artwork {
            position: relative;
            z-index: 1;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-artwork);
        }

        .artwork-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 2;
            pointer-events: none;
        }

        .glitter-layer {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
            border-radius: var(--radius-sm);
        }

        .sparkle {
            position: absolute;
            color: var(--white);
            opacity: 0;
            filter: drop-shadow(0 0 3px rgba(255,255,255,0.9));
            animation: sparkleTwinkle 4s ease-in-out infinite;
            line-height: 1;
            font-size: 10px;
        }

        .sparkle.s1 { top: 12%; left: 18%; animation-delay: 0.0s; font-size: 11px; }
        .sparkle.s2 { top: 22%; left: 72%; animation-delay: 0.6s; font-size: 8px; }
        .sparkle.s3 { top: 38%; left: 12%; animation-delay: 1.2s; font-size: 9px; }
        .sparkle.s4 { top: 55%; left: 82%; animation-delay: 1.8s; font-size: 11px; }
        .sparkle.s5 { top: 68%; left: 26%; animation-delay: 2.4s; font-size: 8px; }
        .sparkle.s6 { top: 78%; left: 64%; animation-delay: 3.0s; font-size: 12px; }
        .sparkle.s7 { top: 44%; left: 46%; animation-delay: 3.4s; font-size: 9px; }
        .sparkle.s8 { top: 8%;  left: 52%; animation-delay: 2.0s; font-size: 7px; }
        .sparkle.s9 { top: 88%; left: 42%; animation-delay: 1.4s; font-size: 8px; }
        .sparkle.s10 { top: 30%; left: 88%; animation-delay: 2.8s; font-size: 7px; }

        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
            20% { opacity: 0.95; transform: scale(1.15) rotate(15deg); }
            40% { opacity: 0.3; transform: scale(0.8) rotate(30deg); }
            60% { opacity: 1; transform: scale(1.05) rotate(45deg); }
            80% { opacity: 0.4; transform: scale(0.7) rotate(60deg); }
        }

        /* ═══ Song title — right under the artwork ═══ */
        .title {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: clamp(1.5rem, 6vw, 1.9rem);
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--off-white);
            margin-bottom: 18px;
            text-wrap: balance;
            animation: fadeUp 0.7s 0.4s ease-out both;
        }

        .title .title-slash {
            color: var(--mid-grey);
            font-weight: 300;
            margin: 0 0.05em;
            display: inline-block;
        }

        /* ═══ Artist block — own line, calmly stacked ═══ */
        .artist-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            margin: 0 auto 22px;
            animation: fadeUp 0.7s 0.5s ease-out both;
        }

        .artist-by {
            font-family: var(--font-mono);
            font-size: 0.55rem;
            font-weight: 500;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--mid-grey);
        }

        .artist-name {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 0.92rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--white);
            line-height: 1.1;
        }

        /* Yoruba Soul — calm serif line under the artist name */
        .soul-line {
            font-family: var(--font-serif);
            font-weight: 500;
            font-style: italic;
            font-size: 1.05rem;
            line-height: 1.2;
            letter-spacing: -0.005em;
            background: linear-gradient(
                180deg,
                #ffffff 0%,
                #dcdcdc 45%,
                #a8a8a8 75%,
                #787878 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            padding: 2px 0 0;
        }

        .soul-prefix {
            font-family: var(--font-mono);
            font-style: normal;
            font-size: 0.5rem;
            font-weight: 500;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: var(--mid-grey);
            margin-right: 5px;
            vertical-align: 1px;
            -webkit-text-fill-color: var(--mid-grey);
        }

        .cta-block {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            animation: fadeUp 0.7s 0.7s ease-out both;
        }

        /* Smaller, quieter "answered prayers" line */
        .answered-cta {
            display: block;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.02em;
            line-height: 1.3;
            color: var(--silver-grey);
            text-decoration: none;
            text-align: center;
            margin-bottom: 8px;
            text-wrap: balance;
            transition: color var(--transition-fast);
        }

        .answered-cta em {
            color: var(--mid-grey);
            font-style: italic;
            font-weight: 600;
        }

        .answered-cta:hover {
            color: var(--white);
        }

        .answered-cta:hover em {
            color: var(--light-grey);
        }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 28px;
            background: var(--white);
            color: var(--deep-black);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: var(--radius-full);
            border: none;
            cursor: pointer;
            transition: transform var(--transition-fast), background var(--transition-fast), box-shadow var(--transition);
            box-shadow: 0 6px 24px rgba(255,255,255,0.08);
        }
        .btn-primary:hover {
            background: var(--off-white);
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(255,255,255,0.15);
        }
        .btn-primary:active {
            transform: translateY(0) scale(0.985);
        }
        .btn-primary svg {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            padding: 14px 24px;
            background: rgba(255,255,255,0.04);
            color: var(--light-grey);
            font-family: var(--font-display);
            font-weight: 500;
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            text-decoration: none;
            border-radius: var(--radius-full);
            border: 1px solid rgba(255,255,255,0.12);
            cursor: pointer;
            transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast), color var(--transition-fast);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.25);
            color: var(--white);
            transform: translateY(-1px);
        }
        .btn-secondary:active {
            transform: scale(0.985);
        }
        .btn-secondary svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            opacity: 0.85;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ═══════════════ DIVIDER ═══════════════ */
        .divider {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 32px 0;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--dark-grey), transparent);
        }
        .divider-diamond {
            width: 5px;
            height: 5px;
            background: var(--dark-grey);
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        /* ═══════════════ TRACKLIST ═══════════════ */
        .tracklist {
            width: 100%;
            animation: fadeUp 0.7s 0.85s ease-out both;
        }

        .section-label {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--mid-grey);
            text-align: center;
            margin-bottom: 18px;
        }

        .track-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius);
            margin-bottom: 10px;
            text-decoration: none;
            color: inherit;
            transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
            cursor: pointer;
        }
        .track-card:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.14);
            transform: translateY(-1px);
        }
        .track-card:active {
            transform: scale(0.99);
        }

        .track-num {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--mid-grey);
            letter-spacing: 0.05em;
            flex-shrink: 0;
            min-width: 22px;
        }

        .track-body {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .track-name {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.01em;
            color: var(--white);
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-family: var(--font-display);
            font-weight: 400;
            font-size: 0.8rem;
            color: var(--mid-grey);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-arrow {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            color: var(--dark-grey);
            transition: color var(--transition-fast), transform var(--transition-fast);
        }
        .track-card:hover .track-arrow {
            color: var(--white);
            transform: translateX(3px);
        }

        /* ═══════════════ MORE PLATFORMS ═══════════════ */
        .more-platforms-block {
            width: 100%;
            text-align: center;
            margin-top: 40px;
            animation: fadeUp 0.7s 1.05s ease-out both;
        }

        .more-platforms-label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.58rem;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--dark-grey);
            margin-bottom: 10px;
        }

        .more-platforms-link {
            display: inline-block;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.02em;
            color: var(--light-grey);
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-full);
            transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast), transform var(--transition-fast);
        }

        .more-platforms-link:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.22);
            color: var(--white);
            transform: translateY(-1px);
        }

        /* ═══════════════ FOOTER ═══════════════ */
        .footer {
            width: 100%;
            margin-top: 48px;
            padding-top: 22px;
            border-top: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            animation: fadeUp 0.7s 1.15s ease-out both;
        }

        .footer-line {
            font-family: var(--font-display);
            font-weight: 400;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            color: var(--mid-grey);
            line-height: 1.7;
        }

        .footer-line strong {
            color: var(--light-grey);
            font-weight: 500;
        }

        .footer-copy {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            color: var(--dark-grey);
            margin-top: 8px;
        }

        /* ═══════════════ RESPONSIVE ═══════════════ */

        @media (max-width: 380px) {
            .page { padding: 18px 18px 40px; }
            .artwork-wrap { max-width: 240px; margin-bottom: 16px; }
            .title { font-size: 1.3rem; margin-bottom: 14px; }
            .artist-block { gap: 2px; margin-bottom: 18px; }
            .artist-by { font-size: 0.5rem; }
            .artist-name { font-size: 0.84rem; }
            .soul-line { font-size: 0.95rem; }
            .soul-prefix { font-size: 0.46rem; margin-right: 4px; }
            .answered-cta { font-size: 0.72rem; }
            .btn-primary { padding: 14px 22px; font-size: 0.82rem; }
            .btn-secondary { padding: 12px 18px; font-size: 0.74rem; }
            .divider { margin: 26px 0; }
            .track-card { padding: 14px 16px; gap: 14px; }
            .track-name { font-size: 0.94rem; }
            .track-artist { font-size: 0.74rem; }
            .more-platforms-block { margin-top: 32px; }
            .prayer-bg { width: 130%; opacity: 0.05; }
        }

        @media (min-width: 640px) {
            .page { max-width: 560px; padding: 40px 32px 64px; }
            .artwork-wrap { max-width: 340px; margin-bottom: 28px; }
            .title { font-size: 2.1rem; margin-bottom: 22px; }
            .artist-block { gap: 4px; margin-bottom: 28px; }
            .artist-by { font-size: 0.6rem; }
            .artist-name { font-size: 1.05rem; letter-spacing: 0.1em; }
            .soul-line { font-size: 1.3rem; }
            .soul-prefix { font-size: 0.54rem; }
            .cta-block { max-width: 380px; gap: 11px; }
            .answered-cta { font-size: 0.88rem; margin-bottom: 10px; }
            .btn-primary { padding: 18px 32px; font-size: 0.92rem; }
            .btn-secondary { padding: 16px 28px; font-size: 0.82rem; }
            .divider { margin: 42px 0; }
            .track-card { padding: 20px 24px; }
            .track-name { font-size: 1.1rem; }
            .more-platforms-block { margin-top: 52px; }
            .more-platforms-link { font-size: 0.92rem; padding: 12px 24px; }
            .footer { margin-top: 60px; }
            .prayer-bg { max-width: 720px; }
        }

        @media (min-width: 900px) {
            .page { max-width: 640px; padding: 52px 40px 80px; }
            .artwork-wrap { max-width: 380px; }
            .title { font-size: 2.3rem; }
            .soul-line { font-size: 1.5rem; }
            .prayer-bg { max-width: 820px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .sparkle { opacity: 0.5 !important; }
        }
    </style>

    function pushAnalyticsEvent(eventName, data) {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
            event: eventName,
            campaign_source: RELEASE_CONFIG.campaignSource,
            ...(data || {})
        });
    }

    document.querySelectorAll('[data-platform]').forEach(function(el) {
        el.addEventListener('click', function() {
            pushAnalyticsEvent('release_cta_click', {
                platform: el.getAttribute('data-platform'),
                destination: el.href,
                cta_location: 'hero'
            });
        });
    });

    document.querySelectorAll('[data-track]').forEach(function(el) {
        el.addEventListener('click', function() {
            pushAnalyticsEvent('release_track_click', {
                track: el.getAttribute('data-track'),
                destination: el.href
            });
        });
    });

    document.querySelectorAll('[data-cta="prayers"]').forEach(function(el) {

        });
    });
