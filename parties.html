<html lang="en">
<head>
  <meta charset="UTF-8"/>

  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    @font-face{font-family:'Aesthet Nova';src:url('fonnts.com-Aesthet-Nova-Black.otf') format('opentype');font-weight:900;font-display:swap}
    @font-face{font-family:'Aesthet Nova';src:url('fonnts.com-Aesthet-Nova-Medium.otf') format('opentype');font-weight:500;font-display:swap}
    @font-face{font-family:'Aesthet Nova';src:url('fonnts.com-Aesthet-Nova-.otf') format('opentype');font-weight:400;font-display:swap}

    :root{
      --black:#0a0a0a;--dark:#111111;--dark2:#1c1c1c;--mid:#2e2e2e;
      --grey:#555555;--silver:#999999;--off:#d4d4d0;--white:#f0ede8;
      --yellow:#C8E000;--pink:#FF3DCC;
      --yts:2px 3px 0px rgba(0,0,0,0.9),0 0 24px rgba(200,224,0,0.06);
      --r-img:14px;--r-sm:10px;--r-pill:999px;
      --ease:cubic-bezier(.2,.7,.2,1);
      --gut:20px;--max:1240px;
    }

    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;background:var(--black);color:var(--white);
      font-family:'Figtree',system-ui,sans-serif;font-size:15px;line-height:1.5;
      overflow-x:hidden;-webkit-font-smoothing:antialiased;
    }
    img{display:block;max-width:100%}
    button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
    a{color:inherit;text-decoration:none}

    .yh{font-family:'Aesthet Nova','Figtree',sans-serif;font-weight:900;color:var(--yellow);text-shadow:var(--yts);line-height:.92}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}

    /* ─── HERO ───────────────────────────────────────────────── */
    .hero{position:relative;min-height:62vh;display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid var(--dark2)}
    .hero-slides{position:absolute;inset:0}
    .hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s var(--ease)}
    .hero-slide.on{opacity:1}
    .hero-slide img{width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(1.05)}
    .hero-grad{position:absolute;inset:0;background:
      linear-gradient(to top,var(--black) 2%,rgba(10,10,10,.82) 38%,rgba(10,10,10,.25) 72%,rgba(10,10,10,.55) 100%)}
    .hero-in{position:relative;width:100%;padding:var(--ac-nav-h,76px) 0 42px}
    .hero-kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);margin-bottom:14px}
    .hero-dot{width:6px;height:6px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 4px rgba(200,224,0,.14)}
    .hero-title{font-size:clamp(34px,7vw,74px);margin:0 0 10px;max-width:16ch}
    .hero-party{font-size:clamp(13px,2vw,16px);color:var(--off);margin-bottom:6px}
    .hero-party b{color:var(--white);font-weight:600}
    .hero-meta{font-size:13px;color:var(--silver);display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:22px}
    .hero-cta{display:inline-flex;align-items:center;gap:9px;background:var(--yellow);color:#0a0a0a;
      font-weight:600;font-size:14px;padding:12px 20px;border-radius:var(--r-pill);transition:transform .18s var(--ease)}
    .hero-cta:hover{transform:translateY(-2px)}
    .hero-pips{position:absolute;right:var(--gut);bottom:46px;display:flex;gap:7px}
    .hero-pip{width:22px;height:3px;border-radius:2px;background:rgba(240,237,232,.26);transition:background .3s}
    .hero-pip.on{background:var(--yellow)}

    /* ─── CONTROLS ───────────────────────────────────────────── */
    /* afrocue-ui.js renders the shared nav as position:fixed at
       z-index 1000 and publishes its height as --ac-nav-h. Sticking
       this at top:0 put it underneath that nav, invisible the moment
       you scrolled. */
    .bar{position:sticky;top:var(--ac-nav-h,76px);z-index:40;background:rgba(10,10,10,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--dark2)}
    .bar-in{display:flex;align-items:center;gap:12px;padding:12px var(--gut);max-width:var(--max);margin:0 auto}
    .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
    .tabs::-webkit-scrollbar{display:none}
    .tab{white-space:nowrap;font-size:13px;color:var(--silver);padding:8px 14px;border-radius:var(--r-pill);
      border:1px solid transparent;transition:all .16s var(--ease)}
    .tab:hover{color:var(--white)}
    .tab.on{background:var(--yellow);color:#0a0a0a;font-weight:600}
    .tab-n{opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums}
    .search{position:relative;flex:0 0 auto}
    .search input{width:168px;background:var(--dark);border:1px solid var(--mid);color:var(--white);
      font-size:13px;padding:9px 12px 9px 32px;border-radius:var(--r-pill);outline:none;transition:border-color .16s,width .2s var(--ease)}
    .search input:focus{border-color:var(--yellow);width:214px}
    .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--grey)}
    @media(max-width:600px){ .search input{width:40px;padding-left:30px} .search input:focus{width:160px} }

    /* ─── EDITION GRID ──────────────────────────────────────── */
    .sec{padding:30px 0 70px}
    .sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 18px}
    .sec-t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--silver)}
    .sec-c{font-size:12px;color:var(--grey);font-variant-numeric:tabular-nums}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:18px}
    @media(max-width:560px){ .grid{grid-template-columns:repeat(2,1fr);gap:11px} }
    @media(max-width:380px){ .grid{grid-template-columns:1fr} }

    .ed{position:relative;text-align:left;background:var(--dark);border:1px solid var(--dark2);
      border-radius:var(--r-img);overflow:hidden;display:flex;flex-direction:column;
      transition:border-color .18s var(--ease),transform .18s var(--ease)}
    .ed:hover{border-color:var(--mid);transform:translateY(-3px)}
    .ed-img{position:relative;aspect-ratio:4/5;background:var(--dark2);overflow:hidden}
    .ed-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
    .ed:hover .ed-img img{transform:scale(1.04)}
    .ed-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(145deg,#1a1a16,#111);color:var(--mid);font-size:34px;
      font-family:'Aesthet Nova',sans-serif;font-weight:900}
    .ed-chip{position:absolute;top:10px;left:10px;font-size:10px;font-weight:600;letter-spacing:.07em;
      text-transform:uppercase;padding:5px 9px;border-radius:var(--r-pill);backdrop-filter:blur(8px)}
    .chip-now{background:var(--yellow);color:#0a0a0a}
    .chip-soon{background:rgba(255,61,204,.92);color:#fff}
    .chip-wknd{background:rgba(240,237,232,.92);color:#0a0a0a}
    .chip-past{background:rgba(10,10,10,.72);color:var(--silver);border:1px solid var(--mid)}
    .chip-off{background:rgba(10,10,10,.72);color:#ff8585;border:1px solid rgba(255,133,133,.4);text-decoration:line-through}
    .ed-unconf{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;
      background:rgba(10,10,10,.76);border:1px solid var(--mid);color:var(--silver);
      display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
    .ed-b{padding:13px 14px 15px;display:flex;flex-direction:column;gap:4px;flex:1}
    .ed-date{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--yellow)}
    .ed-name{font-size:15px;font-weight:600;line-height:1.26;color:var(--white);
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .ed-party{font-size:12px;color:var(--silver);margin-top:1px}
    .ed-party b{color:var(--off);font-weight:500}
    .ed-foot{margin-top:auto;padding-top:9px;display:flex;align-items:center;gap:8px;
      font-size:11.5px;color:var(--grey);border-top:1px solid var(--dark2)}
    .ed-foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ed-free{color:var(--yellow);font-weight:600}
    .ph{color:var(--grey);font-style:italic}

    /* ─── SHEET (edition + party) ───────────────────────────── */
    .sheet-wrap{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;
      background:rgba(6,6,6,.76);backdrop-filter:blur(6px);padding:0}
    .sheet-wrap.on{display:flex}
    @media(min-width:760px){ .sheet-wrap{align-items:center;padding:28px} }
    .sheet{position:relative;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
      background:var(--dark);border:1px solid var(--dark2);border-radius:var(--r-img) var(--r-img) 0 0;
      animation:up .3s var(--ease)}
    @media(min-width:760px){ .sheet{border-radius:var(--r-img)} }
    @keyframes up{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
    .sheet-x{position:absolute;top:12px;right:12px;z-index:3;width:34px;height:34px;border-radius:50%;
      background:rgba(10,10,10,.68);backdrop-filter:blur(8px);color:var(--white);font-size:15px;
      display:flex;align-items:center;justify-content:center}
    .sheet-hero{position:relative;aspect-ratio:16/10;background:var(--dark2);overflow:hidden}
    .sheet-hero img{width:100%;height:100%;object-fit:cover}
    .sheet-hero-g{position:absolute;inset:0;background:linear-gradient(to top,var(--dark),transparent 62%)}
    .sheet-b{padding:4px 22px 26px}
    @media(max-width:520px){ .sheet-b{padding:4px 16px 22px} }
    .sheet-kick{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);margin-bottom:8px}
    .sheet-t{font-size:clamp(22px,5vw,30px);margin:0 0 4px;font-family:'Aesthet Nova','Figtree',sans-serif;
      font-weight:900;color:var(--white);line-height:1.05}
    .sheet-sub{font-size:13.5px;color:var(--silver);margin-bottom:18px}
    .sheet-sub a{color:var(--off);border-bottom:1px solid var(--mid)}
    .sheet-sub a:hover{color:var(--yellow);border-color:var(--yellow)}

    .facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--dark2);
      border:1px solid var(--dark2);border-radius:var(--r-sm);overflow:hidden;margin-bottom:18px}
    .fact{background:var(--dark);padding:11px 13px}
    .fact-k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin-bottom:3px}
    .fact-v{font-size:13.5px;color:var(--white)}
    .fact-v.hl{color:var(--yellow);font-weight:600}

    .blk{margin-bottom:18px}
    .blk-k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);margin-bottom:8px}
    .djs{display:flex;flex-wrap:wrap;gap:7px}
    .dj{font-size:13px;background:var(--dark2);border:1px solid var(--mid);color:var(--off);
      padding:6px 11px;border-radius:var(--r-pill)}
    .note{font-size:13.5px;color:var(--off);background:rgba(200,224,0,.05);
      border-left:2px solid var(--ev-line,rgba(200,224,0,.3));padding:11px 14px;border-radius:0 var(--r-sm) var(--r-sm) 0}
    .note b{color:var(--yellow);font-weight:600}
    .btns{display:flex;flex-wrap:wrap;gap:9px}
    .btn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;
      padding:11px 17px;border-radius:var(--r-pill);transition:transform .16s var(--ease)}
    .btn:hover{transform:translateY(-2px)}
    .btn-y{background:var(--yellow);color:#0a0a0a}
    .btn-o{border:1px solid var(--mid);color:var(--white)}
    .btn-o:hover{border-color:var(--yellow);color:var(--yellow)}

    .plist{display:flex;flex-direction:column;gap:1px;background:var(--dark2);
      border-radius:var(--r-sm);overflow:hidden}
    .prow{display:flex;align-items:center;gap:12px;background:var(--dark);padding:11px 13px;text-align:left;width:100%}
    .prow:hover{background:var(--dark2)}
    .prow-d{font-size:12px;color:var(--yellow);min-width:92px;font-weight:600}
    .prow-n{font-size:13px;color:var(--off);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .prow-t{font-size:11px;color:var(--grey)}
    .prow.past .prow-d{color:var(--grey)}

    .bio{font-size:14.5px;line-height:1.6;color:var(--off);margin-bottom:18px}
    .bio.none{color:var(--grey);font-style:italic}

    /* ─── FEATURED SLOT ─────────────────────────────────────── */
    .feat{position:relative;display:grid;grid-template-columns:1.15fr 1fr;gap:0;
      border:1px solid var(--dark2);border-radius:var(--r-img);overflow:hidden;
      background:var(--dark);margin-bottom:26px;text-align:left;width:100%}
    @media(max-width:660px){ .feat{grid-template-columns:1fr} }
    .feat-img{position:relative;aspect-ratio:16/10;background:var(--dark2);overflow:hidden}
    .feat-img img{width:100%;height:100%;object-fit:cover}
    .feat-b{padding:22px;display:flex;flex-direction:column;justify-content:center;gap:7px}
    .feat-k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow)}
    .feat-n{font-size:clamp(20px,3.4vw,27px);font-family:'Aesthet Nova','Figtree',sans-serif;
      font-weight:900;color:var(--white);line-height:1.04}
    .feat-m{font-size:13px;color:var(--silver)}
    .feat-bio{font-size:13.5px;color:var(--off);line-height:1.55;
      display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

    /* ─── COUNTDOWN ─────────────────────────────────────────── */
    .cd{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
      letter-spacing:.04em;padding:6px 11px;border-radius:var(--r-pill);
      border:1px solid var(--mid);color:var(--silver)}
    .cd.today{border-color:var(--yellow);color:var(--yellow)}
    .cd.soon{border-color:rgba(255,61,204,.5);color:var(--pink)}
    .cd.dim{color:var(--grey)}

    /* ─── PULSE + POSTS on the party panel ──────────────────── */
    .pulse{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
    .tag{font-size:11.5px;background:var(--dark2);border:1px solid var(--mid);
      color:var(--silver);padding:5px 10px;border-radius:var(--r-pill)}
    .tag.quiet{color:#ffb38a;border-color:rgba(255,179,138,.35)}
    .posts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    @media(max-width:520px){ .posts{grid-template-columns:repeat(2,1fr)} }
    .post{display:block;border-radius:var(--r-sm);overflow:hidden;background:var(--dark2);
      border:1px solid var(--dark2)}
    .post img{width:100%;aspect-ratio:1;object-fit:cover}
    .post-c{padding:7px 8px;font-size:11px;color:var(--grey);line-height:1.35;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

    /* ─── INTERESTED ────────────────────────────────────────── */
    .int{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;
      padding:11px 17px;border-radius:var(--r-pill);border:1px solid var(--mid);color:var(--white)}
    .int:hover{border-color:var(--pink);color:var(--pink)}
    .int.on{background:var(--pink);border-color:var(--pink);color:#fff}
    .int svg{width:15px;height:15px}

    /* ─── STATES ─────────────────────────────────────────────── */
    .msg{text-align:center;padding:66px 20px;color:var(--silver)}
    .msg-t{font-size:17px;color:var(--white);margin-bottom:7px}
    .msg-s{font-size:13.5px;max-width:40ch;margin:0 auto;color:var(--grey)}
    .skel{border-radius:var(--r-img);background:
      linear-gradient(100deg,var(--dark) 28%,var(--dark2) 44%,var(--dark) 60%);
      background-size:300% 100%;animation:sh 1.3s linear infinite;aspect-ratio:4/5}
    @keyframes sh{from{background-position:140% 0}to{background-position:-40% 0}}
    @media(prefers-reduced-motion:reduce){
      .skel{animation:none} .hero-slide{transition:none} .ed:hover{transform:none} .btn:hover,.hero-cta:hover{transform:none}
    }
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WB5HQGFV" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <!-- SHARED NAV (rendered by js/afrocue-ui.js) -->
  <div id="ac-nav"></div>

  <!-- HERO: rotates through the next few nights -->
  <section class="hero" id="hero" aria-label="Next up">
    <div class="hero-slides" id="heroSlides"></div>
    <div class="hero-grad"></div>
    <div class="hero-in wrap">
      <div class="hero-kicker"><span class="hero-dot"></span><span id="heroKick">Next up</span></div>
      <h1 class="hero-title yh" id="heroTitle">Nights</h1>
      <div class="hero-party" id="heroParty"></div>
      <div class="hero-meta" id="heroMeta"></div>
      <a class="hero-cta" id="heroCta" href="#">
        See the night
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
    <div class="hero-pips" id="heroPips"></div>
  </section>

  <!-- CONTROLS -->
  <div class="bar">
    <div class="bar-in">
      <div class="tabs" id="tabs" role="tablist"></div>
      <a class="tab" href="parties.html" style="flex:0 0 auto" title="The full party directory">Parties &rarr;</a>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <label class="sr" for="q">Search parties and DJs</label>
        <input id="q" type="search" placeholder="Search" autocomplete="off"/>
      </div>
    </div>
  </div>

  <!-- THE GRID -->
  <section class="sec wrap">
    <div class="sec-h">
      <div class="sec-t" id="secT">Upcoming</div>
      <div class="sec-c" id="secC"></div>
    </div>
    <div id="feat"></div>
    <div class="grid" id="grid"></div>
    <div id="state"></div>
  </section>

  <!-- SHEET -->
  <div class="sheet-wrap" id="sheetWrap" role="dialog" aria-modal="true">
    <div class="sheet" id="sheet"></div>
  </div>

  <!-- SHARED FOOTER (rendered by js/afrocue-ui.js) -->
  <div id="ac-footer"></div>
  <script src="js/afrocue-ui.js" data-nav="full" data-footer="full"></script>

  <!-- Shared config -->
  <script src="afrocue.js"></script>

  <script>
  (function () {
    'use strict';

    /* ─── CONFIG ──────────────────────────────────────────────
       One endpoint. ?export=editions returns { parties, editions }
       together, which is why the old CSV fetch is gone: it matched
       editions against CSV parties by id, so a party row created
       today had no match and its nights rendered as nothing. */
    /* The URL lives in afrocue.js and nowhere else. There is no
       hardcoded fallback on purpose: the one that used to be in here
       pointed at an older deployment than the config did, so if
       afrocue.js ever failed to load the page would quietly query a
       dead endpoint and render "no nights listed yet", which looks
       like an empty directory rather than a broken one. */
    var URL_BASE = window.AFROCUE_SCRIPT_URL ||
      (window.AFROCUE_CONFIG && window.AFROCUE_CONFIG.scriptUrl) || '';
    var API = URL_BASE ? URL_BASE + '?export=editions' : '';

    /* If a standalone per-party page ever exists, put it here and the
       party link points at it instead of the in-page panel. */
    var PARTY_PAGE = '';

    var HERO_MAX = 5, HERO_MS = 6000;

    var PARTIES = {}, EDITIONS = [], VIEW = 'upcoming', QUERY = '';
    var heroAt = 0, heroTimer = null, heroList = [];

    /* ─── DATES ───────────────────────────────────────────────
       Everything is compared as a plain yyyy-mm-dd string and
       rendered in Lagos terms. No timezone arithmetic, because the
       only thing that matters is which calendar day it is there. */
    var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function iso(v) {
      if (!v) return '';
      var s = String(v).trim();
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
      var t = new Date(s);
      if (isNaN(t)) return '';
      var l = new Date(t.getTime() + 3600e3);          /* Lagos is UTC+1 */
      return l.toISOString().slice(0, 10);
    }
    function todayIso() {
      var l = new Date(Date.now() + 3600e3);
      return l.toISOString().slice(0, 10);
    }
    function ord(n) {
      var s = ['th','st','nd','rd'], v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }
    function fmt(d) {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso(d));
      if (!m) return '';
      var x = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
      var out = DAYS[x.getUTCDay()] + ' ' + ord(x.getUTCDate()) + ' ' + MONS[x.getUTCMonth()];
      if (+m[1] !== new Date().getFullYear()) out += ' ' + m[1];
      return out;
    }
    /* A two day party is one night with an end, so it reads as a
       range. The month is dropped from the first half when both fall
       in it. A backwards range is data error, not a rendering mode. */
    function span(a, b) {
      var A = iso(a), B = iso(b);
      if (!A) return '';
      if (!B || B <= A) return fmt(A);
      var fa = fmt(A), fb = fmt(B);
      if (A.slice(0, 7) === B.slice(0, 7)) {
        var cut = fa.replace(/\s+\S+$/, '');
        if (cut && cut !== fa) return cut + ' - ' + fb;
      }
      return fa + ' - ' + fb;
    }
    function daysOut(d) {
      var A = iso(d);
      if (!A) return null;
      return Math.round((Date.UTC(+A.slice(0,4), +A.slice(5,7) - 1, +A.slice(8,10)) -
        Date.UTC(+todayIso().slice(0,4), +todayIso().slice(5,7) - 1, +todayIso().slice(8,10))) / 864e5);
    }
    /* Friday, Saturday or Sunday within the next 7 days. */
    function isWeekend(d) {
      var n = daysOut(d);
      if (n === null || n < 0 || n > 7) return false;
      var A = iso(d);
      var w = new Date(Date.UTC(+A.slice(0,4), +A.slice(5,7) - 1, +A.slice(8,10))).getUTCDay();
      return w === 5 || w === 6 || w === 0;
    }

    /* A live countdown, not just a date. The old page had this and it
       is the single most useful thing on a listing: a reader scanning
       wants to know how long they have, not what day it is. Doors
       default to 21:00 when a time was not announced, because a Lagos
       party at an unstated hour is a night party. */
    function parseTime(t) {
      var m = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i.exec(String(t || ''));
      if (!m) return '';
      var h = +m[1], mi = m[2] ? +m[2] : 0, ap = (m[3] || '').toLowerCase();
      if (ap === 'pm' && h < 12) h += 12;
      if (ap === 'am' && h === 12) h = 0;
      if (h > 23 || mi > 59) return '';
      return (h < 10 ? '0' : '') + h + ':' + (mi < 10 ? '0' : '') + mi;
    }
    function countdown(d, t) {
      var A = iso(d);
      if (!A) return null;
      var when = new Date(A + 'T' + (parseTime(t) || '21:00') + ':00+01:00');
      if (isNaN(when)) return null;
      var ms = when - new Date();
      if (ms <= 0) return { past: true };
      return { d: Math.floor(ms / 864e5), h: Math.floor(ms % 864e5 / 36e5), past: false };
    }
    function toGo(e) {
      if (e.state === 'cancelled') return { t: 'Cancelled', c: 'dim' };
      var c = countdown(e.date, e.time);
      if (!c) return { t: 'Date not announced', c: 'dim' };
      if (c.past) return { t: 'Finished', c: 'dim' };
      if (c.d === 0) return { t: c.h < 6 ? 'Happening now' : 'Tonight', c: 'today' };
      if (c.d === 1) return { t: 'Tomorrow', c: 'today' };
      if (c.d <= 14) return { t: c.d + ' days to go', c: 'soon' };
      if (c.d <= 31) return { t: 'In ' + Math.ceil(c.d / 7) + ' weeks', c: '' };
      return { t: fmt(e.date), c: '' };
    }
    /* Whether a party is alive. 60 days with no night, or a fortnight
       since the scraper last managed to read them, is worth saying out
       loud rather than letting a reader assume a dead page is current. */
    function pulseTags(p) {
      var out = [];
      if (p.recurrence || p.day_of_week) {
        out.push([p.recurrence, p.day_of_week].filter(Boolean).join(', '));
      }
      (p.genres || []).slice(0, 3).forEach(function (g) { out.push(g); });
      (p.vibe_tags || []).slice(0, 2).forEach(function (g) { out.push(g); });
      var n = daysOut(p.last_date);
      if (n !== null && n < -60) out.push({ quiet: 'Nothing since ' + fmt(p.last_date) });
      return out;
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function safeUrl(u) {
      var s = String(u || '').trim();
      return /^https?:\/\//i.test(s) ? s : '';
    }

    /* ─── CHIPS ───────────────────────────────────────────────
       The chip answers "when", which is the only thing a reader
       scanning a grid actually wants from it. */
    function chip(e) {
      if (e.state === 'cancelled') return { c: 'chip-off', t: 'Cancelled' };
      var n = daysOut(e.date);
      if (n === null) return null;
      if (n < 0) return { c: 'chip-past', t: 'Past' };
      if (n === 0) return { c: 'chip-now', t: 'Tonight' };
      if (n === 1) return { c: 'chip-soon', t: 'Tomorrow' };
      if (isWeekend(e.date)) return { c: 'chip-wknd', t: 'This weekend' };
      return { c: 'chip-past', t: 'In ' + n + ' days' };
    }

    function party(e) { return PARTIES[e.party_id] || {}; }
    function edTitle(e) { return e.name || party(e).name || e.party_id || 'Untitled night'; }
    /* Most nights have no name of their own, so the title falls back
       to the party's. When that happens the "by <party>" line beneath
       would just repeat it, which reads as a mistake. */
    function edNamed(e) {
      return !!(e.name && party(e).name &&
        e.name.trim().toLowerCase() !== party(e).name.trim().toLowerCase());
    }
    function edImage(e) {
      return safeUrl(e.flyer) || safeUrl((e.media || [])[0]) ||
             safeUrl(party(e).hero_img) || '';
    }
    function placeOf(e) {
      if (e.venue) return esc(e.venue);
      if (e.venue_held) return '<span class="ph">Given out on the night</span>';
      if (e.area) return esc(e.area);
      return '<span class="ph">Venue to be announced</span>';
    }

    /* ─── CARD ────────────────────────────────────────────────── */
    function card(e) {
      var p = party(e), c = chip(e), img = edImage(e);
      var initial = (edTitle(e)[0] || 'A').toUpperCase();

      return '<button class="ed" onclick="acOpenEdition(\'' + esc(e.id) + '\')" ' +
        'aria-label="' + esc(edTitle(e)) + ', ' + esc(span(e.date, e.end_date)) + '">' +
        '<div class="ed-img">' +
          (img ? '<img src="' + esc(img) + '" alt="" loading="lazy" ' +
                 'onerror="this.parentNode.innerHTML=\'<div class=&quot;ed-noimg&quot;>' + esc(initial) + '</div>\'"/>'
               : '<div class="ed-noimg">' + esc(initial) + '</div>') +
          (c ? '<span class="ed-chip ' + c.c + '">' + c.t + '</span>' : '') +
          (e.review ? '<span class="ed-unconf" title="Date worked out from a day name, not read off a flyer">?</span>' : '') +
        '</div>' +
        '<div class="ed-b">' +
          '<div class="ed-date">' + esc(span(e.date, e.end_date)) + (e.time ? ' &middot; ' + esc(e.time) : '') + '</div>' +
          '<div class="ed-name">' + esc(edTitle(e)) + '</div>' +
          /* The franchise, under the night. The night is the thing;
             the party is who runs it. */
          (edNamed(e) ? '<div class="ed-party">by <b>' + esc(p.name) + '</b></div>' : '') +
          '<div class="ed-foot">' +
            '<span>' + placeOf(e) + '</span>' +
            (e.entry_free ? '<span class="ed-free">Free</span>'
                          : (e.entry ? '<span>' + esc(e.entry) + '</span>' : '')) +
          '</div>' +
        '</div>' +
      '</button>';
    }

    /* ─── VIEWS ───────────────────────────────────────────────── */
    var VIEWS = [
      { k: 'upcoming', t: 'Upcoming', f: function (e) { var n = daysOut(e.date); return n !== null && n >= 0 && e.state !== 'cancelled'; } },
      { k: 'weekend',  t: 'This weekend', f: function (e) { return isWeekend(e.date) && e.state !== 'cancelled'; } },
      { k: 'free',     t: 'Free entry', f: function (e) { var n = daysOut(e.date); return e.entry_free && n !== null && n >= 0; } },
      { k: 'past',     t: 'Past', f: function (e) { var n = daysOut(e.date); return n !== null && n < 0; } },
      { k: 'all',      t: 'Everything', f: function () { return true; } }
    ];

    function matches(e) {
      if (!QUERY) return true;
      var p = party(e);
      var hay = [edTitle(e), p.name, p.organiser, e.venue, e.area, p.handle,
                 (e.lineup || []).join(' ')].join(' ').toLowerCase();
      return hay.indexOf(QUERY) > -1;
    }
    function listFor(k) {
      var v = VIEWS.filter(function (x) { return x.k === k; })[0] || VIEWS[0];
      var out = EDITIONS.filter(v.f).filter(matches);
      out.sort(function (a, b) {
        var A = iso(a.date), B = iso(b.date);
        return k === 'past' ? (A < B ? 1 : A > B ? -1 : 0) : (A < B ? -1 : A > B ? 1 : 0);
      });
      return out;
    }

    function renderTabs() {
      document.getElementById('tabs').innerHTML = VIEWS.map(function (v) {
        var n = EDITIONS.filter(v.f).filter(matches).length;
        return '<button class="tab' + (v.k === VIEW ? ' on' : '') + '" role="tab" ' +
          'onclick="acSetView(\'' + v.k + '\')">' + v.t +
          '<span class="tab-n">' + n + '</span></button>';
      }).join('');
    }

    /* The Featured column on Parties, which is your editorial slot. It
       only shows on Upcoming, and only when that party actually has a
       night coming: a featured party with nothing announced is an
       advert for an empty page. */
    function renderFeatured() {
      var host = document.getElementById('feat');
      host.innerHTML = '';
      if (VIEW !== 'upcoming' || QUERY) return;

      var ids = Object.keys(PARTIES).filter(function (k) { return PARTIES[k].featured; });
      if (!ids.length) return;

      var pick = null, night = null;
      for (var i = 0; i < ids.length && !pick; i++) {
        var up = listFor('upcoming').filter(function (e) { return e.party_id === ids[i]; });
        if (up.length) { pick = PARTIES[ids[i]]; night = up[0]; }
      }
      if (!pick || !night) return;

      var img = edImage(night) || safeUrl(pick.hero_img) || safeUrl(pick.upcoming_flyer);
      var go = toGo(night);

      host.innerHTML = '<button class="feat" onclick="acOpenEdition(\'' + esc(night.id) + '\')">' +
        (img ? '<div class="feat-img"><img src="' + esc(img) + '" alt=""/></div>' : '') +
        '<div class="feat-b">' +
          '<div class="feat-k">Featured</div>' +
          '<div class="feat-n">' + esc(edTitle(night)) + '</div>' +
          (edNamed(night) ? '<div class="feat-m">by ' + esc(pick.name) + '</div>' : '') +
          '<div class="feat-m">' + esc(span(night.date, night.end_date)) +
            (night.venue ? ' &middot; ' + esc(night.venue) : '') + '</div>' +
          (pick.bio ? '<div class="feat-bio">' + esc(pick.bio) + '</div>' : '') +
          '<div style="margin-top:6px"><span class="cd ' + go.c + '">' + esc(go.t) + '</span></div>' +
        '</div></button>';
    }

    function render() {
      renderTabs();
      renderFeatured();
      var rows = listFor(VIEW);
      var v = VIEWS.filter(function (x) { return x.k === VIEW; })[0] || VIEWS[0];
      document.getElementById('secT').textContent = v.t;
      document.getElementById('secC').textContent =
        rows.length + (rows.length === 1 ? ' night' : ' nights');
      document.getElementById('grid').innerHTML = rows.map(card).join('');

      var s = document.getElementById('state');
      if (rows.length) { s.innerHTML = ''; return; }
      s.innerHTML = '<div class="msg"><div class="msg-t">' +
        (QUERY ? 'Nothing matches that' : 'Nothing here yet') + '</div>' +
        '<div class="msg-s">' + (QUERY
          ? 'Try a party name, a venue or a DJ.'
          : 'Nights appear here within a few hours of being announced on Instagram.') +
        '</div></div>';
    }

    window.acSetView = function (k) {
      VIEW = k;
      render();
      var navH = parseInt(getComputedStyle(document.documentElement)
        .getPropertyValue('--ac-nav-h'), 10) || 76;
      window.scrollTo({ top: document.querySelector('.bar').offsetTop - navH - 1, behavior: 'smooth' });
    };

    /* ─── EDITION SHEET ───────────────────────────────────────
       The night, and only the night. The party gets one line out,
       because a reader who clicked a Saturday wants the Saturday. */
    window.acOpenEdition = function (id) {
      var e = EDITIONS.filter(function (x) { return x.id === id; })[0];
      if (!e) return;
      var p = party(e), img = edImage(e), c = chip(e);
      var tickets = safeUrl(e.ticket_url), source = safeUrl(e.source_link);

      var h = '<button class="sheet-x" onclick="acCloseSheet()" aria-label="Close">&#x2715;</button>';

      if (img) {
        h += '<div class="sheet-hero"><img src="' + esc(img) + '" alt=""/><div class="sheet-hero-g"></div></div>';
      }

      var go = toGo(e);
      h += '<div class="sheet-b">' +
        '<div class="sheet-kick"><span class="cd ' + go.c + '">' + esc(go.t) + '</span></div>' +
        '<h2 class="sheet-t">' + esc(edTitle(e)) + '</h2>' +
        '<div class="sheet-sub">' +
          (edNamed(e)
            ? 'by <a href="#p-' + esc(e.party_id) + '" onclick="acOpenParty(\'' + esc(e.party_id) + '\');return false;">' + esc(p.name) + '</a>'
            : [e.venue || e.area, p.city].filter(Boolean).map(esc).join(', ')) +
        '</div>' +

        '<div class="facts">' +
          fact('Date', esc(span(e.date, e.end_date)), 'hl') +
          fact('Time', e.time ? esc(e.time) : '<span class="ph">Not stated</span>') +
          fact('Venue', placeOf(e)) +
          fact('Entry', e.entry_free ? 'Free' : (e.entry ? esc(e.entry) : '<span class="ph">Not stated</span>'),
               e.entry_free ? 'hl' : '') +
        '</div>';

      if ((e.lineup || []).length) {
        h += '<div class="blk"><div class="blk-k">Lineup' +
          (e.lineup_source === 'flyer' ? ' &middot; read off the flyer' : '') + '</div>' +
          '<div class="djs">' + e.lineup.map(function (d) {
            return '<span class="dj">' + esc(d) + '</span>';
          }).join('') + '</div></div>';
      }

      if (e.summary) {
        h += '<div class="blk"><div class="note"><b>Donna</b> &middot; ' + esc(e.summary) + '</div></div>';
      }
      if (e.review) {
        h += '<div class="blk"><div class="note">This date was worked out from a day name rather than read off a flyer, so treat it as unconfirmed.</div></div>';
      }

      h += '<div class="btns">' +
        (tickets ? '<a class="btn btn-y" href="' + esc(tickets) + '" target="_blank" rel="noopener">Tickets</a>' : '') +
        '<button class="int' + (marked(e.id) ? ' on' : '') + '" id="intBtn" onclick="acInterested(\'' + esc(e.id) + '\')">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>' +
          '<span id="intN">' + (Number(e.interested) || 0) + '</span></button>' +
        (source ? '<a class="btn btn-o" href="' + esc(source) + '" target="_blank" rel="noopener">The post</a>' : '') +
        (p.name ? '<button class="btn btn-o" onclick="acOpenParty(\'' + esc(e.party_id) + '\')">More on ' + esc(p.name) + '</button>' : '') +
      '</div></div>';

      openSheet(h, 'e-' + e.id);
      ping('edview', e.id);
    };

    /* ?action=edview and ?action=edinterested have been sitting in
       PartiesApi.gs unused, which is why the Editions tab's Views and
       Interested columns are all zero. JSONP via a script tag because
       Apps Script does not send CORS headers on a web app GET. */
    function ping(action, id) {
      if (!URL_BASE || !id) return;
      try {
        var cb = 'acCb' + Math.random().toString(36).slice(2, 8);
        window[cb] = function () { try { delete window[cb]; } catch (err) {} };
        var sc = document.createElement('script');
        sc.src = URL_BASE + '?action=' + action + '&id=' + encodeURIComponent(id) + '&callback=' + cb;
        sc.onload = sc.onerror = function () { sc.remove(); };
        document.body.appendChild(sc);
      } catch (err) { /* a stat is never worth an error on the page */ }
    }
    /* One per browser, so a reader cannot run the count up by tapping.
       Wrapped because Safari in private mode throws on localStorage. */
    function marked(id) {
      try { return !!localStorage.getItem('ac_int_' + id); } catch (err) { return false; }
    }
    window.acInterested = function (id) {
      if (marked(id)) return;
      try { localStorage.setItem('ac_int_' + id, '1'); } catch (err) {}
      var e = EDITIONS.filter(function (x) { return x.id === id; })[0];
      if (e) e.interested = (Number(e.interested) || 0) + 1;
      var b = document.getElementById('intBtn'), n = document.getElementById('intN');
      if (b) b.classList.add('on');
      if (n && e) n.textContent = Number(e.interested) || 0;
      ping('edinterested', id);
    };

    function fact(k, v, cls) {
      return '<div class="fact"><div class="fact-k">' + k + '</div>' +
        '<div class="fact-v ' + (cls || '') + '">' + v + '</div></div>';
    }

    /* ─── PARTY PANEL ─────────────────────────────────────────
       Where the bio lives. Not on the edition. */
    window.acOpenParty = function (pid) {
      if (PARTY_PAGE) { window.location.href = PARTY_PAGE + encodeURIComponent(pid); return; }
      var p = PARTIES[pid];
      if (!p) return;

      var mine = EDITIONS.filter(function (e) { return e.party_id === pid; });
      var up = mine.filter(function (e) { var n = daysOut(e.date); return n !== null && n >= 0; })
                   .sort(function (a, b) { return iso(a.date) < iso(b.date) ? -1 : 1; });
      var past = mine.filter(function (e) { var n = daysOut(e.date); return n !== null && n < 0; })
                     .sort(function (a, b) { return iso(a.date) > iso(b.date) ? -1 : 1; });

      var hero = safeUrl(p.hero_img) || (up[0] ? edImage(up[0]) : '') || (past[0] ? edImage(past[0]) : '');
      var ig = safeUrl(p.instagram);

      var h = '<button class="sheet-x" onclick="acCloseSheet()" aria-label="Close">&#x2715;</button>';
      if (hero) h += '<div class="sheet-hero"><img src="' + esc(hero) + '" alt=""/><div class="sheet-hero-g"></div></div>';

      h += '<div class="sheet-b">' +
        '<div class="sheet-kick">' + (mine.length || 'No') + (mine.length === 1 ? ' night' : ' nights') + ' on AfroCue</div>' +
        '<h2 class="sheet-t">' + esc(p.name || pid) + '</h2>' +
        '<div class="sheet-sub">' +
          [p.area, p.city].filter(Boolean).map(esc).join(', ') +
          (ig ? ' &middot; <a href="' + esc(ig) + '" target="_blank" rel="noopener">@' + esc(p.handle || '') + '</a>' : '') +
        '</div>';

      var tags = pulseTags(p);
      if (tags.length) {
        h += '<div class="pulse">' + tags.map(function (t) {
          return typeof t === 'string'
            ? '<span class="tag">' + esc(t) + '</span>'
            : '<span class="tag quiet">' + esc(t.quiet) + '</span>';
        }).join('') + '</div>';
      }

      h += p.bio
        ? '<div class="bio">' + esc(p.bio) + '</div>'
        : '<div class="bio none">No description yet.</div>';

      if (up.length) {
        h += '<div class="blk"><div class="blk-k">Coming up</div><div class="plist">' +
          up.map(function (e) { return prow(e, false); }).join('') + '</div></div>';
      }
      if (past.length) {
        h += '<div class="blk"><div class="blk-k">Previously</div><div class="plist">' +
          past.slice(0, 8).map(function (e) { return prow(e, true); }).join('') + '</div></div>';
      }

      /* Ten columns on the Parties tab feed these three slots and the
         rebuilt page rendered none of them, because the endpoint was
         not sending them either. */
      if ((p.posts || []).length) {
        h += '<div class="blk"><div class="blk-k">Latest from ' + esc(p.name || pid) + '</div>' +
          '<div class="posts">' + p.posts.slice(0, 3).map(function (po) {
            var u = safeUrl(po.url);
            return '<' + (u ? 'a class="post" href="' + esc(u) + '" target="_blank" rel="noopener"' : 'div class="post"') + '>' +
              '<img src="' + esc(po.img) + '" alt="" loading="lazy"/>' +
              (po.cap ? '<div class="post-c">' + esc(po.cap) + '</div>' : '') +
              '</' + (u ? 'a' : 'div') + '>';
          }).join('') + '</div></div>';
      }

      h += '<div class="btns">' +
        (safeUrl(p.ticket_url) ? '<a class="btn btn-y" href="' + esc(safeUrl(p.ticket_url)) + '" target="_blank" rel="noopener">Tickets</a>' : '') +
        (ig ? '<a class="btn btn-o" href="' + esc(ig) + '" target="_blank" rel="noopener">Instagram</a>' : '') +
        (safeUrl(p.website) ? '<a class="btn btn-o" href="' + esc(safeUrl(p.website)) + '" target="_blank" rel="noopener">Website</a>' : '') +
      '</div></div>';

      openSheet(h, 'p-' + pid);
      ping('view', pid);
    };

    function prow(e, isPast) {
      return '<button class="prow' + (isPast ? ' past' : '') + '" onclick="acOpenEdition(\'' + esc(e.id) + '\')">' +
        '<span class="prow-d">' + esc(span(e.date, e.end_date)) + '</span>' +
        '<span class="prow-n">' + esc(edTitle(e)) + '</span>' +
        '<span class="prow-t">' + (e.state === 'cancelled' ? 'Cancelled' : (e.venue || e.area || '')) + '</span>' +
      '</button>';
    }

    /* ─── SHEET PLUMBING ──────────────────────────────────────── */
    var lastFocus = null;
    function openSheet(html, hash) {
      lastFocus = document.activeElement;
      var w = document.getElementById('sheetWrap');
      document.getElementById('sheet').innerHTML = html;
      document.getElementById('sheet').scrollTop = 0;
      w.classList.add('on');
      document.body.style.overflow = 'hidden';
      if (hash && location.hash.slice(1) !== hash) {
        try { history.pushState(null, '', '#' + hash); } catch (err) {}
      }
    }
    window.acCloseSheet = function () {
      document.getElementById('sheetWrap').classList.remove('on');
      document.body.style.overflow = '';
      if (location.hash) { try { history.pushState(null, '', location.pathname); } catch (err) {} }
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    };
    document.getElementById('sheetWrap').addEventListener('click', function (ev) {
      if (ev.target === this) window.acCloseSheet();
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && document.getElementById('sheetWrap').classList.contains('on')) {
        window.acCloseSheet();
      }
    });

    function fromHash() {
      var h = location.hash.slice(1);
      if (/^e-/.test(h)) window.acOpenEdition(h.slice(2));
      else if (/^p-/.test(h)) window.acOpenParty(h.slice(2));
    }
    window.addEventListener('popstate', function () {
      var h = location.hash.slice(1);
      if (!h) {
        document.getElementById('sheetWrap').classList.remove('on');
        document.body.style.overflow = '';
      } else fromHash();
    });

    /* ─── HERO ────────────────────────────────────────────────── */
    function buildHero() {
      heroList = listFor('upcoming').filter(edImage).slice(0, HERO_MAX);
      if (!heroList.length) heroList = listFor('upcoming').slice(0, HERO_MAX);

      var slides = document.getElementById('heroSlides');
      var pips = document.getElementById('heroPips');

      if (!heroList.length) {
        document.getElementById('heroKick').textContent = 'Lagos';
        document.getElementById('heroTitle').textContent = 'Nights';
        document.getElementById('heroParty').textContent = '';
        document.getElementById('heroMeta').textContent = 'Nothing announced right now.';
        document.getElementById('heroCta').style.display = 'none';
        pips.innerHTML = '';
        return;
      }

      slides.innerHTML = heroList.map(function (e, i) {
        var img = edImage(e);
        return '<div class="hero-slide' + (i === 0 ? ' on' : '') + '">' +
          (img ? '<img src="' + esc(img) + '" alt=""/>' : '') + '</div>';
      }).join('');
      pips.innerHTML = heroList.map(function (_, i) {
        return '<button class="hero-pip' + (i === 0 ? ' on' : '') + '" ' +
          'onclick="acHeroGo(' + i + ')" aria-label="Slide ' + (i + 1) + '"></button>';
      }).join('');

      heroAt = 0; paintHero();
      if (heroList.length > 1) {
        clearInterval(heroTimer);
        heroTimer = setInterval(function () { acHeroGo((heroAt + 1) % heroList.length); }, HERO_MS);
      }
    }
    function paintHero() {
      var e = heroList[heroAt];
      if (!e) return;
      var p = party(e), c = chip(e);
      document.getElementById('heroKick').textContent = c ? c.t : 'Next up';
      document.getElementById('heroTitle').textContent = edTitle(e);
      document.getElementById('heroParty').innerHTML = edNamed(e) ? 'by <b>' + esc(p.name) + '</b>' : '';
      document.getElementById('heroMeta').innerHTML = [
        esc(span(e.date, e.end_date)) + (e.time ? ' &middot; ' + esc(e.time) : ''),
        placeOf(e),
        e.entry_free ? 'Free entry' : (e.entry ? esc(e.entry) : '')
      ].filter(Boolean).join('<span style="color:var(--mid)">/</span>');
      var cta = document.getElementById('heroCta');
      cta.style.display = '';
      cta.onclick = function (ev) { ev.preventDefault(); window.acOpenEdition(e.id); };

      [].forEach.call(document.querySelectorAll('.hero-slide'), function (s, i) {
        s.classList.toggle('on', i === heroAt);
      });
      [].forEach.call(document.querySelectorAll('.hero-pip'), function (s, i) {
        s.classList.toggle('on', i === heroAt);
      });
    }
    window.acHeroGo = function (i) { heroAt = i; paintHero(); };

    /* ─── LOAD ────────────────────────────────────────────────── */
    function skeletons() {
      document.getElementById('grid').innerHTML =
        new Array(8).join('.').split('.').map(function () { return '<div class="skel"></div>'; }).join('');
    }

    function boot() {
      if (!API) {
        document.getElementById('grid').innerHTML = '';
        document.getElementById('state').innerHTML =
          '<div class="msg"><div class="msg-t">Not configured</div>' +
          '<div class="msg-s">AFROCUE_SCRIPT_URL is missing, so there is no ' +
          'directory to read. Check that afrocue.js loaded.</div></div>';
        buildHero();
        return;
      }
      skeletons();
      fetch(API)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (d) {
          (d.parties || []).forEach(function (p) { if (p && p.id) PARTIES[p.id] = p; });
          EDITIONS = (d.editions || []).filter(function (e) { return e && e.id && iso(e.date); });

          if (!EDITIONS.length) {
            document.getElementById('grid').innerHTML = '';
            document.getElementById('state').innerHTML =
              '<div class="msg"><div class="msg-t">No nights listed yet</div>' +
              '<div class="msg-s">Parties appear here within a few hours of being announced.</div></div>';
            buildHero();
            return;
          }
          buildHero();
          render();
          fromHash();
        })
        .catch(function (err) {
          console.error('AfroCue parties:', err);
          document.getElementById('grid').innerHTML = '';
          document.getElementById('state').innerHTML =
            '<div class="msg"><div class="msg-t">Could not load the parties</div>' +
            '<div class="msg-s">Something went wrong reaching the directory. Refreshing usually fixes it.</div></div>';
        });
    }

    var qEl = document.getElementById('q'), qT = null;
    qEl.addEventListener('input', function () {
      clearTimeout(qT);
      qT = setTimeout(function () { QUERY = qEl.value.trim().toLowerCase(); render(); }, 140);
    });

    boot();
  })();
  </script>
</body>
</html>
